# The Host on one server, with Caddy in front for HTTPS (certificates from Let's Encrypt, renewed automatically).
# Needs: a DNS name pointing at this server, ports 80 and 443 open to the internet, Docker with the compose plugin.
#   cp host.env.example host.env      # then fill it in
#   docker compose up -d
# The Host itself is not published on any port: only Caddy can reach it, which is what TrustProxy in http.json assumes.
name: opentail

services:
  host:
    image: ${OPENTAIL_IMAGE:-opentail-orca:latest}
    restart: unless-stopped
    env_file: host.env
    volumes:
      - ../config:/config:ro
      - host-data:/data
    expose:
      - "8080"

  caddy:
    image: caddy:2.8
    restart: unless-stopped
    depends_on: [ host ]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      OPENTAIL_DOMAIN: ${OPENTAIL_DOMAIN:?set OPENTAIL_DOMAIN, e.g. approvals.example.com}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  host-data:
  caddy-data:
  caddy-config:
