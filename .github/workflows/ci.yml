name: CI

# The OpenTail Host: Host*, the modules, the profiles, the container image.
# The Connectivity libraries come as packages from opentail-connectivity (GitHub Packages); reading them needs a token with
# read:packages in the PACKAGES_READ_TOKEN secret (nuget.config reads it as GITHUB_PACKAGES_TOKEN).

on:
  push:
    branches: [ main ]
    tags: [ 'host-v*' ]
    # Documentation-only pushes skip CI (saves Actions minutes). Tag pushes always run: path filters do not apply to tags.
    paths-ignore: [ '**/*.md' ]
  pull_request:
    paths-ignore: [ '**/*.md' ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GITHUB_PACKAGES_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN }}

jobs:
  build-test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # MinVer reads the host-v* tags for the package version

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # The vulnerability audit stays on: a new advisory fails the build until it is pinned or upgraded.
      - name: Restore
        run: dotnet restore OpenTail.Host.slnx

      - name: Build
        run: dotnet build OpenTail.Host.slnx -c Release --no-restore

      - name: Test
        run: dotnet test --solution OpenTail.Host.slnx -c Release --no-build

  deployment-check:
    name: Deployment check (packages, outside consumers, module worker)
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: check-host-deployments
        shell: pwsh
        run: ./scripts/check-host-deployments.ps1

  container:
    name: Container image (build and smoke test)
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -f OpenTail.Host.Server/Dockerfile --secret id=github_packages_token,env=GITHUB_PACKAGES_TOKEN -t opentail-host:ci .

      - name: Refuses to start without configuration
        run: |
          set +e
          docker run --rm opentail-host:ci
          code=$?
          set -e
          test "$code" -eq 64

      - name: Starts from /config and serves signed-in MCP
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cfg"
          cp OpenTail.Host.Server/config/policy.json "$RUNNER_TEMP/cfg/"
          out=$(docker run --rm opentail-host:ci --new-api-key ci-agent)
          key=$(echo "$out" | grep -o 'otk_[A-Za-z0-9_-]*')
          entry=$(echo "$out" | grep '"Hash"' | sed 's/^ *//')
          sed "s#\"ApiKeys\": \[#\"ApiKeys\": [ $entry#" OpenTail.Host.Server/config/http.json > "$RUNNER_TEMP/cfg/http.json"
          docker run -d --name host -p 18080:8080 -v "$RUNNER_TEMP/cfg:/config:ro" opentail-host:ci
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:18080/healthz && break; sleep 1; done
          curl -fsS http://127.0.0.1:18080/healthz
          h=(-H "Host: approvals.example.com" -H "X-Forwarded-Proto: https")
          test "$(curl -s -o /dev/null -w '%{http_code}' "${h[@]}" -X POST http://127.0.0.1:18080/mcp)" = 401
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: attacker.example' http://127.0.0.1:18080/)" = 400
          curl -fsS "${h[@]}" -H "Authorization: Bearer $key" -H 'Content-Type: application/json' -H 'Accept: application/json, text/event-stream' \
            -X POST http://127.0.0.1:18080/mcp \
            -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' \
            | grep -q '"name":"opentail-host"'
          docker exec host test -f /data/opentail-host.db

      - name: Host log
        if: always()
        run: docker logs host || true

  publish:
    name: Publish packages and image
    if: startsWith(github.ref, 'refs/tags/host-v')
    needs: [ build-test, deployment-check, container ]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Version from the tag
        run: echo "VERSION=${GITHUB_REF_NAME#host-v}" >> "$GITHUB_ENV"

      - name: Pack
        run: dotnet pack OpenTail.Host.slnx -c Release -o out

      - name: Push packages to GitHub Packages
        run: dotnet nuget push "out/*.nupkg" --source https://nuget.pkg.github.com/opentail-net/index.json --api-key ${{ secrets.GITHUB_TOKEN }} --skip-duplicate

      - name: Build and push the image to GHCR (private)
        run: |
          set -euo pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          image=ghcr.io/opentail-net/opentail-host
          docker build -f OpenTail.Host.Server/Dockerfile --secret id=github_packages_token,env=GITHUB_PACKAGES_TOKEN \
            --build-arg VERSION="$VERSION" \
            --label org.opencontainers.image.source=https://github.com/opentail-net/opentail-host \
            --label org.opencontainers.image.version="$VERSION" \
            -t "$image:$VERSION" .
          docker push "$image:$VERSION"
          case "$VERSION" in *-*) ;; *) docker tag "$image:$VERSION" "$image:latest"; docker push "$image:latest" ;; esac
