name: MongoDB on a real server

# The MongoDB module against mongo:8 (OpenTail.Host.Tests.MongoDb): the four tools through the Host with a read-only user, guard
# refusals that never reach the server, the response cap, and the server time limit and action id on every operation. Linux only
# and never on every push, to save Actions minutes: run it by hand, or it runs when the module, these tests or this workflow change.

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'OpenTail.Modules.MongoDb/**'
      - 'OpenTail.Host.Tests.MongoDb/**'
      - '.github/workflows/mongodb.yml'

permissions:
  contents: read

concurrency:
  group: mongodb-${{ github.ref }}
  cancel-in-progress: true

env:
  GITHUB_PACKAGES_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN }}
  # Throwaway passwords for a throwaway container; they guard nothing.
  ROOT_PASSWORD: Ci_Admin_Pass_1234x
  READ_PASSWORD: Ci_Read_Pass_1234x

jobs:
  mongodb:
    name: MongoDB 8
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mongo:
        image: mongo:8
        env:
          MONGO_INITDB_ROOT_USERNAME: root
          MONGO_INITDB_ROOT_PASSWORD: Ci_Admin_Pass_1234x
        ports: [ '27017:27017' ]
        options: --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 })'" --health-interval 5s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build OpenTail.Host.Tests.MongoDb -c Release

      - name: A read-only user
        run: |
          docker exec ${{ job.services.mongo.id }} mongosh --quiet -u root -p "$ROOT_PASSWORD" --authenticationDatabase admin --eval "
            db.getSiblingDB('otail').createUser({ user: 'ot_reader', pwd: '$READ_PASSWORD', roles: [ { role: 'read', db: 'otail' } ] })"

      - name: Test
        env:
          OTAIL_MONGODB_ADMIN: mongodb://root:${{ env.ROOT_PASSWORD }}@localhost:27017/?authSource=admin
          OTAIL_MONGODB_READ: mongodb://ot_reader@localhost:27017/otail?authSource=otail
          OTAIL_MONGODB_READ_PASSWORD: ${{ env.READ_PASSWORD }}
        # A skipped test here means a variable is missing: fail rather than pass quietly.
        run: |
          dotnet test --project OpenTail.Host.Tests.MongoDb -c Release --no-build 2>&1 | tee test.log
          status=${PIPESTATUS[0]}
          if grep -Eq "skipped: [1-9]" test.log; then echo "::error::Some server tests were skipped"; exit 1; fi
          exit $status
